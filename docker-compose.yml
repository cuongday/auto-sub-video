services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: auto-sub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (8+ chars)}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"      # web console, this machine only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auto-sub:
    build:
      context: .
      args:
        FULL: "1"            # 0 = lightweight image (edge-tts + Gemini/OpenAI only, no Demucs/ASR/VieNeu)
    image: auto-sub:latest
    container_name: auto-sub
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      # this machine only by default: the app can browse HOST_ROOT. Set AUTOSUB_BIND=0.0.0.0 to open it to the LAN
      - "${AUTOSUB_BIND:-127.0.0.1}:${AUTOSUB_PORT:-8020}:8020"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-autosub}
      # the ADC file is mounted below; inside the container both point at the mounted copy
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
      ADC_HOST_PATH: /secrets/adc.json
      AUTOSUB_PORT: "8020"
    tmpfs:
      - /tmp
    volumes:
      - models:/data/models                                  # downloaded AI models (not job data)
      - ${ADC_HOST_PATH:-/dev/null}:/secrets/adc.json:ro     # gcloud ADC (only needed for Gemini)
      - ${HOST_ROOT:-~}:/host:ro                             # host folder browsable from the web UI (read-only)
    restart: unless-stopped

volumes:
  minio-data:
  models:
