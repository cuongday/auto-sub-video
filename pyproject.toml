[project]
name = "auto-sub"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9",
  "google-genai>=1.0", "openai>=1.40", "edge-tts>=7.0", "numpy>=1.26", "soundfile>=0.12",
  "python-dotenv>=1.0", "minio>=7.2",
]
[project.optional-dependencies]
# onnxruntime>=1.24 rejects VieNeu's external weights stored in the Hugging Face blob cache
# ("External data path escapes model directory"); 1.23.x is the last release that loads them
full = ["demucs>=4.0", "funasr>=1.1", "modelscope", "faster-whisper>=1.0", "vieneu", "onnxruntime>=1.20,<1.24"]
dev = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
autosub = "autosub.cli:main"
[tool.setuptools]
packages = ["autosub", "autosub.asr", "autosub.llm", "autosub.tts"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real models / network (make test-slow)", "minio: needs docker to start a MinIO (make test-minio)"]
addopts = "-m 'not slow and not minio'"
